# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: workload
displayName: T3 Code
description: >-
  T3 Code server with pi, running inside the sandbox and driven from a browser
  on the host. No host filesystem access: git is the only channel in and out.
sourceUrl: https://github.com/juranki/t3-code-kit
licenses: [MIT]
provides: ["t3-code@0.1.5"]

args:
  t3Version:
    default: "0.1.5"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    buildArg: T3_VERSION
  piVersion:
    default: "latest"
    pattern: "^[A-Za-z0-9.@/_-]+$"
    buildArg: PI_VERSION
  # The baked mise toolchain. Java is not here: it is the base image's
  # OpenJDK 21, put on PATH by the Dockerfile. Bumping one of these is a
  # `rebuild`, the same as t3Version and piVersion.
  nodeVersion:
    default: "22.23.4"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    buildArg: NODE_VERSION
  goVersion:
    default: "1.25.14"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    buildArg: GO_VERSION
  pythonVersion:
    default: "3.13.18"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    buildArg: PYTHON_VERSION
  # pi's provider, as a host credential-store service name. Change both when
  # you use a different provider:  sbx secret set <provider>
  provider:
    default: mistral
    pattern: "^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$"
  providerApiKeyEnv:
    default: MISTRAL_API_KEY
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

capabilities:
  # Target the sandbox agent platform: the runtime owns the process tree and
  # honors the image's declared user, instead of leaving the image entrypoint
  # as PID 1. Without this the entrypoint was never executed at all in
  # practice, and the server never started.
  - type: com.docker.sandbox/sbx@1

  # t3 serve is the workload, not an agent the host launches: it outlives the
  # session that started it and keeps running while the browser is closed.
  - type: com.docker.sandbox/long-running@1
    description: the t3 server outlives any session

  # How the server actually starts. A startup hook sees only the environment
  # it declares, so every variable serve.sh and its children need is listed
  # here - including the proxy variables, without which t3 and pi cannot
  # reach anything through the sandbox's egress proxy.
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: exec /home/agent/serve.sh
          user: agent
          background: true
          description: Start the T3 Code server
          env:
            - HOME
            - PATH
            # The startup hook sees only what it declares, so the image's
            # UTF-8 locale is not inherited: without these two, serve.sh and
            # the terminal t3 spawns from it run LC_ALL=C, where a Scandinavian
            # character cannot be typed and correct UTF-8 renders as mojibake.
            - LANG
            - LC_ALL
            - T3CODE_HOME
            - T3CODE_HOST
            - T3CODE_PORT
            - T3CODE_NO_BROWSER
            - ${{ kit.args.providerApiKeyEnv }}
            - GH_TOKEN
            - HTTP_PROXY
            - HTTPS_PROXY
            - ALL_PROXY
            - NO_PROXY
            - http_proxy
            - https_proxy
            - all_proxy
            - no_proxy
            - SSL_CERT_FILE
            - SSL_CERT_DIR
            - PROXY_CA_CERT_B64

  # No `family:` here. It was added to port@1 on 2026-10-26 and an sbx build
  # from before that rejects the descriptor with "unknown field \"family\"".
  # Omitted means ipv4, which is what t3 bound to 0.0.0.0 answers on anyway.
  # Everything else in this descriptor uses fields from the initial spec
  # release, so it validates on older runtimes too.
  - type: com.docker.sandbox/port@1
    name: t3-code web UI
    config:
      container: 3773
      transport: tcp

  # Repos and t3 state live on volumes, so `rm` does not destroy them. Only
  # `t3-code-kit nuke` does.
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/workspace
      size: 20GiB
  # State only, never all of /home/agent/.t3. The t3 binary is a symlink into
  # $T3CODE_HOME/runtime/versions/<v>/t3, so a volume over the whole base dir
  # shadows the install and leaves that symlink dangling.
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.t3/userdata
      size: 10GiB
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.t3/projects
      size: 1GiB
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.t3/worktrees
      size: 5GiB

  # Clone and push only. The proxy swaps the sentinel for the real token after
  # traffic leaves the VM, so the sandbox never holds the credential.
  - type: com.docker.sandbox/credential@1
    name: GitHub
    description: clone and push over https
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - { domain: github.com, header: Authorization, format: "Bearer %s" }
          - { domain: api.github.com, header: Authorization, format: "Bearer %s" }

  # pi's model provider. Optional so a sandbox still comes up without it; the
  # agent round-trip in bin/smoke is what proves it actually works.
  #
  # `inject` is what makes the proxy swap the `proxy-managed` sentinel for the
  # real key. Without it the sandbox gets the sentinel, sends it as-is, and the
  # provider answers 401 Invalid API Key.
  #
  # ⚠️ inject.domain cannot be a kit arg (the schema takes plain strings), so
  # switching provider means editing three things together: `provider` and
  # `providerApiKeyEnv` above, and the domain/header/format below. The domain
  # must also stay in network-policy's runtime allow list.
  #   anthropic:  api.anthropic.com   x-api-key      %s
  #   openai:     api.openai.com      Authorization  Bearer %s
  - type: com.docker.sandbox/credential@1
    name: pi model provider
    optional: true
    config:
      service: ${{ kit.args.provider }}
      phase: runtime
      apiKey:
        name: ${{ kit.args.providerApiKeyEnv }}
        proxyManaged: true
        inject:
          - domain: api.mistral.ai
            header: Authorization
            format: "Bearer %s"

  # Mirrors policy/allow.txt (runtime) and policy/install.txt (install-time).
  # The descriptor is normative — it travels with the
  # image, under one digest — and `bin/smoke` fails if the two disagree.
  - type: com.docker.sandbox/network-policy@2
    config:
      # Install-time only. The skills install is pinned to a commit, so the
      # CLI clones at that sha instead of asking api.github.com for a tree —
      # which is why api.github.com is in runtime.allow but not here. Unpin
      # SKILLS_REF and the build starts making a denied request it then falls
      # back from; it still works, but the log entry is the signal.
      install:
        allow:
          - t3.codes
          - registry.npmjs.org
          - github.com
          - objects.githubusercontent.com
          - archive.ubuntu.com
          - security.ubuntu.com
          # The baked mise toolchain: node from nodejs.org, go from
          # dl.google.com, python from pypi.org / files.pythonhosted.org.
          # Install-time only — runtime.allow stays without them, so an
          # on-demand `mise install` inside a sandbox is a 403 by design.
          - nodejs.org
          - dl.google.com
          - pypi.org
          - files.pythonhosted.org
      runtime:
        allow:
          - api.anthropic.com
          - api.openai.com
          - api.mistral.ai
          - github.com
          - api.github.com
          - codeload.github.com
          - objects.githubusercontent.com
          # t3 fetches its model manifest from here; without it the UI shows
          # a bundled, stale model list.
          - raw.githubusercontent.com
          # pi's own catalog and version checks.
          - pi.dev
          # t3's Agent Client Protocol (ACP) icon CDN: one SVG per agent it can
          # drive. Cosmetic only — denied, the agent list renders without icons.
          - cdn.agentclientprotocol.com
          - registry.npmjs.org
        deny:
          # t3's telemetry and T3 Connect relay. Not needed to run a local
          # server, and an unattended agent should not be phoning home.
          - ingest.t3.codes
          - relay.t3.codes
          # The `skills` CLI's telemetry (`/tele/t` and `/tele/audit`), hit by
          # `npx skills add ...`. Installing skills itself goes through
          # registry.npmjs.org and github.com, which stay allowed; only the
          # phone-home is refused. The CLI treats a failed ping as non-fatal,
          # and DISABLE_TELEMETRY=1 / DO_NOT_TRACK=1 skip it entirely.
          - www.skills.sh

  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      filename: AGENTS.md
      content: |
        # You are in a sandbox

        This machine has no access to the host filesystem. There is no shared
        mount, no host home directory, and no way to reach the user's files.

        - Work only inside `/home/agent/workspace`.
        - Git is the only channel in and out: clone, commit, push a branch.
          The user reviews and merges on their own machine.
        - Egress is deny-by-default. A blocked destination answers HTTP 403
          from the proxy, not a connection error. Report it; do not retry.
        - `/home/agent/workspace` and `/home/agent/.t3/{userdata,projects,worktrees}`
          are volumes and survive a sandbox restart.
        - The git identity is already configured: `Agent for <your name>`
          with the user's own email. The `Agent for ` prefix is deliberate -
          it says an agent, not the human, made the commit. Do not strip it,
          and do not override it with `--author` or `-c user.name=...`. If a
          commit needs a different author, ask the user first.
